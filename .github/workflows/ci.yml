name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pest (Unit & Feature)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql, gd, intl, zip, bcmath
          coverage: none

      - name: Composer-Cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Abhängigkeiten installieren
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Umgebung vorbereiten
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        # Läuft gegen SQLite in-memory (siehe phpunit.xml) und braucht deshalb
        # weder eine MySQL-Instanz noch einen Asset-Build.
        run: php artisan test

  lint:
    name: Code-Stil (Pint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: vendor/bin/pint --test

  assets:
    name: Frontend-Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build-Ergebnis für die Browsertests sichern
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: public/build
          retention-days: 1

  dusk:
    name: Dusk (End-to-End)
    runs-on: ubuntu-latest
    needs: assets

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: pokemon_database_dusk
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, gd, intl, zip, bcmath
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Gebaute Assets holen
        uses: actions/download-artifact@v4
        with:
          name: build
          path: public/build

      - name: Umgebung vorbereiten
        run: |
          cp .env.dusk.local.example .env.dusk.local
          cp .env.example .env

          # `php artisan serve` friert die Umgebung beim Start ein: Der
          # Serverprozess liest die .env EINMAL, `artisan dusk` tauscht sie
          # danach gegen .env.dusk.local -- und der Server bekommt davon nichts
          # mehr mit. Weichen die beiden Dateien ab, laufen Testprozess und
          # Server auf verschiedenen Datenbanken: Die Tests legen ihre Fixtures
          # an, der Browser sieht sie nie und wartet sich tot.
          #
          # Deshalb bekommt die .env hier dieselben Werte, die auch in
          # .env.dusk.local stehen. Der Tausch ändert dann nichts mehr.
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=pokemon_database_dusk/' .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env

          php artisan key:generate
          php artisan key:generate --env=dusk.local

          echo "--- .env (Auszug) ---"
          grep -E '^(APP_ENV|APP_URL|DB_DATABASE|SESSION_DRIVER|CACHE_STORE)=' .env
          echo "--- .env.dusk.local (Auszug) ---"
          grep -E '^(APP_ENV|APP_URL|DB_DATABASE|SESSION_DRIVER|CACHE_STORE)=' .env.dusk.local

      - name: Datenbank migrieren
        run: php artisan migrate --force

      - name: ChromeDriver aktualisieren
        run: php artisan dusk:chrome-driver --detect

      - name: Dusk
        # Server und Tests laufen bewusst im SELBEN Schritt.
        #
        # Vorher startete der Server in einem eigenen Schritt: Der Healthcheck
        # war grün, mitten im Testlauf brach der Browser dann aber mit
        # net::ERR_CONNECTION_REFUSED ab -- der Prozess überlebte die
        # Schrittgrenze nicht zuverlässig. In einem Schritt gestartet, hängt er
        # an derselben Shell wie `artisan dusk` und lebt genauso lange.
        #
        # PHP_CLI_SERVER_WORKERS: Der eingebaute Server bearbeitet sonst genau
        # eine Anfrage zur Zeit. Eine Dusk-Seite lädt aber gleichzeitig CSS und
        # JS vom selben Server -- das reiht sich hinter der Seite ein und macht
        # jeden Aufruf unnötig langsam.
        env:
          PHP_CLI_SERVER_WORKERS: 4
        run: |
          php artisan serve --no-reload > storage/logs/serve.log 2>&1 &
          SERVER_PID=$!

          bereit=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000 > /dev/null; then bereit=1; break; fi
            sleep 1
          done

          if [ "$bereit" -ne 1 ]; then
            echo "Server ist nicht hochgekommen. Antwort und Server-Log:"
            curl -sS -i http://127.0.0.1:8000 | head -n 40 || true
            cat storage/logs/serve.log || true
            exit 1
          fi

          # Schritte laufen mit `bash -e`: Ohne das `||` bräche das Skript beim
          # ersten Testfehler ab, und die Diagnose darunter liefe nie.
          ergebnis=0
          php artisan dusk || ergebnis=$?

          # Lebt der Server danach noch? Wenn nicht, ist das die eigentliche
          # Meldung -- die Testfehler sind dann nur die Folge davon.
          if kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "Der Testserver lief bis zum Schluss."
          else
            echo "ACHTUNG: Der Testserver war am Ende nicht mehr am Leben."
          fi

          echo "===== storage/logs/serve.log ====="
          cat storage/logs/serve.log || true

          exit $ergebnis

      - name: Logs bei Fehlschlag ausgeben
        if: failure()
        run: |
          echo "===== storage/logs/laravel.log (letzte 200 Zeilen) ====="
          tail -n 200 storage/logs/laravel.log 2>/dev/null || echo "(keine)"
          echo "===== storage/logs/serve.log ====="
          cat storage/logs/serve.log 2>/dev/null || echo "(keine)"
          echo "===== Browser-Konsole ====="
          tail -n 50 tests/Browser/console/*.log 2>/dev/null || echo "(keine)"

      - name: Screenshots bei Fehlschlag sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-screenshots
          path: |
            tests/Browser/screenshots
            tests/Browser/console
            storage/logs
